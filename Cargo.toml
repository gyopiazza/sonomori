[package]
name = "sonomori"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Slice an imported sound into a tempo-synced loop"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
arc-swap = "1"
atomic_float = "1.1"
egui = { version = "0.37.0", features = ["default_fonts"] }
nice-plug = { version = "0.4.2", features = ["standalone"] }
nice-plug-egui = "0.6.0"
# wgpu only. The software renderer redraws the whole window on macOS and
# spikes the CPU while the playhead is moving. Canvas is the waveform path.
# The thread pool is the executor the poll subscription needs. Fira Sans is
# the embedded UI face.
nice-plug-iced = { version = "0.5.0", default-features = false, features = [
    "canvas",
    "fira-sans",
    "thread-pool",
    "wgpu",
] }
parking_lot = "0.12"
rfd = "0.15"
rtrb = "0.4"
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "alac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
triple_buffer = "9"

[target.'cfg(target_os = "macos")'.dependencies]
baseview = "0.4.2"
dispatch2 = "0.3"
keyboard-types = "0.8.3"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSView", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", features = [
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
] }
raw-window-handle = "0.6.2"
rune = { git = "https://github.com/anomalyco/rune", rev = "bba30a61cfcec6683e3fdedf156a92dae89d8b04", default-features = false, features = [
    "embedded-fonts",
    "metal-backend",
] }

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
