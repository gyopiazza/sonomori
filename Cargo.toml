[package]
name = "sonomori"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Slice an imported sound into a tempo-synced loop"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
arc-swap = "1"
atomic_float = "1.1"
nice-plug = { version = "0.4.2", features = ["standalone"] }
# `wgpu` matches the old egui OpenGL path. tiny-skia is only the fallback if
# that surface cannot be created: on macOS it repaints the whole window on
# the CPU, which pegs a core while the playhead is moving. `canvas` draws
# the waveform.
nice-plug-iced = { version = "0.5.0", default-features = false, features = [
    "canvas",
    "fira-sans",
    "thread-pool",
    "wgpu",
    "tiny-skia",
] }
parking_lot = "0.12"
rfd = "0.15"
rtrb = "0.4"
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "alac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
triple_buffer = "9"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
