[package]
name = "sonomori"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Slice an imported sound into a tempo-synced loop"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
arc-swap = "1"
atomic_float = "1.1"
nice-plug = { version = "0.4.2", features = ["standalone"] }
# wgpu only. The software renderer redraws the whole window on macOS and
# spikes the CPU while the playhead is moving. Canvas is the waveform path.
# The thread pool is the executor the poll subscription needs. Fira Sans is
# the embedded UI face.
# `lazy` keeps the waveform and sliders from rebuilding on every playhead step.
nice-plug-iced = { version = "0.5.0", default-features = false, features = [
    "canvas",
    "fira-sans",
    "lazy",
    "thread-pool",
    "wgpu",
] }
parking_lot = "0.12"
rfd = "0.15"
rtrb = "0.4"
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "alac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
triple_buffer = "9"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# Same optimizer as release, with line tables left in so `sample` can
# attribute the profiling run. `scripts/profile-iced.sh` builds this.
[profile.profiling]
inherits = "release"
strip = "none"
debug = "line-tables-only"
